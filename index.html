<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- وسوم منع التخزين الموقت والتحديث التلقائي -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>إيجي مود - EGYMOD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

    <!-- 🚫 إخفاء أسهم الزيادة والنقصان وضبط التوافق بين المتصفح والموبايل -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      /* 📱 ضبط أبعاد الأزرار للشاشات الصغيرة فقط دون المساس بتصميم الكمبيوتر */
      @media (max-width: 640px) {
        #root > div {
          padding: 10px 6px !important;
        }

        /* تقليل الحشو الداخلي وأبعاد الأزرار على الهواتف منعاً للاستطالة */
        section button {
          padding: 10px 10px !important;
          gap: 6px !important;
          border-radius: 12px !important;
        }

        section button span:first-child {
          font-size: 12.5px !important;
          line-height: 1.25 !important;
        }

        section button span:last-child {
          width: 30px !important;
          height: 30px !important;
        }

        section button span:last-child svg {
          width: 15px !important;
          height: 15px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
