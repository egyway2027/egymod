<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- وسوم منع التخزين الموقت والتحديث التلقائي -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>إيجي مود - EGYMOD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

    <!-- 🚫 إخفاء أسهم الزيادة والنقصان وضبط تمدد شاشات الموبايل -->
    <style>
      html, body, #root, #root > div {
        width: 100% !important;
        max-width: 100% !important;
        min-height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow-x: hidden !important;
      }

      /* 📱 كسر كافة قيود العرض المحدود وInline Styles على الهواتف */
      @media (max-width: 768px) {
        div, main, section, [class*="max-w-"], [style*="max-width"], [style*="maxWidth"] {
          max-width: 100% !important;
          width: 100% !important;
          box-sizing: border-box !important;
        }
        
        #root > div {
          padding-left: 8px !important;
          padding-right: 8px !important;
        }
      }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
