name: Build Android App

on:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 --legacy-peer-deps

      - name: Initialize & Build React Project
        run: |
          npx cap init EGYMOD com.egymod.app --web-dir dist
          npm run build

      - name: Prepare & Upload Capgo OTA Bundle
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          cd dist && zip -r ../ota-bundle.zip . && cd ..
          if [ -n "$CAPGO_TOKEN" ]; then
            npx @capgo/cli@latest upload --token "$CAPGO_TOKEN" --channel production || true
          fi

      - name: Add Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync android
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle

      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "
          android {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          " >> android/app/build.gradle

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EGYMOD-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
